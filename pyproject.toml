[project]
name = "diffconv"
version = "0.1.0"
description = "Convert unified diffs to context diff format"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
diffconv = "diffconv.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
